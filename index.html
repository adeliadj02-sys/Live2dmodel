<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D Framer Embed (Local Scripts)</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
        canvas { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

    <canvas id="live2d-canvas"></canvas>

    <!-- Load library files locally from your own repository to bypass CDN network blocks -->
    <script defer src="./pixi.min.js"></script>
    <script defer src="./live2d.min.js"></script>
    <script defer src="./cubism4.min.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Give the browser 300ms to safely process the local scripts sequentially
            setTimeout(() => {
                if (typeof PIXI === 'undefined') {
                    console.error("Local load failed: PIXI is still undefined.");
                    return;
                }

                const canvas = document.getElementById('live2d-canvas');
                
                const app = new PIXI.Application({
                    view: canvas,
                    autoStart: true,
                    resizeTo: window,
                    transparent: true,
                    backgroundAlpha: 0
                });

                const modelUrl = "./model.model3.json";

                PIXI.live2d.Live2DModel.from(modelUrl).then(model => {
                    app.stage.addChild(model);

                    const scaleX = app.screen.width / model.width;
                    const scaleY = app.screen.height / model.height;
                    const scale = Math.min(scaleX, scaleY) * 0.9; 
                    
                    model.scale.set(scale);
                    model.anchor.set(0.5, 0.5);
                    model.position.set(app.screen.width / 2, app.screen.height / 2);

                    model.interactive = true;
                    model.trackedPointers = [{ id: 0, x: app.screen.width / 2, y: app.screen.height / 2 }];

                    window.addEventListener('resize', () => {
                        model.position.set(app.screen.width / 2, app.screen.height / 2);
                    });
                }).catch(err => {
                    console.error("Failed to load Live2D model file structure:", err);
                });
            }, 300);
        });
    </script>
</body>
</html>
