<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pure Code Live2D</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
        canvas { width: 100%; height: 100%; display: block; }
    </style>
    <!-- Standard Open-Source Libraries -->
    <script src="https://cloudflare.com"></script>
    <script src="https://live2d.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <canvas id="live2d-canvas"></canvas>
    <script>
        const app = new PIXI.Application({
            view: document.getElementById('live2d-canvas'),
            autoStart: true,
            resizeTo: window,
            transparent: true
        });

        // Put the link to your manually rigged Live2D file here:
        const modelUrl = "https://raw.githubusercontent.com/adeliadj02-sys/Live2dmodel/refs/heads/main/Web%20Model.model3.json";

        PIXI.live2d.Live2DModel.from(modelUrl).then(model => {
            app.stage.addChild(model);
            
            // Traditional math to center the character
            const scale = Math.min(app.screen.width / model.width, app.screen.height / model.height) * 0.9;
            model.scale.set(scale);
            model.anchor.set(0.5, 0.5);
            model.position.set(app.screen.width / 2, app.screen.height / 2);

            // Enable built-in interactive tracking code
            model.interactive = true;
            model.trackedPointers = [{ id: 0, x: app.screen.width / 2, y: app.screen.height / 2 }];

            // Manual hit-detection code for clicking
            model.on("pointertap", (event) => {
                const hitAreas = model.hitTest(event.data.global.x, event.data.global.y);
                if (hitAreas.includes("Head")) {
                    model.motion("TapHead"); 
                } else {
                    model.motion("TapBody");
                }
            });
        });
    </script>
</body>
</html>
