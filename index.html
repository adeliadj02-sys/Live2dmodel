<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D Framer Embed</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
        canvas { width: 100%; height: 100%; display: block; }
    </style>
    <!-- Library PixiJS v5 -->
    <script src="https://cloudflare.com"></script>
    <!-- Library Core Live2D Alternatif (Anti-Block Security Policy) -->
    <script src="https://jsdelivr.net"></script>
    <!-- Wrapper Pixi-Live2D -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <canvas id="live2d-canvas"></canvas>

    <script>
        const canvas = document.getElementById('live2d-canvas');
        
        const app = new PIXI.Application({
            view: canvas,
            autoStart: true,
            resizeTo: window,
            transparent: true,
            backgroundAlpha: 0
        });

        // MASUKKAN LINK YANG SUDAH ANDA BUAT DI LANGKAH 1 DI SINI:
        const modelUrl = "./web model.model3.json";

        PIXI.live2d.Live2DModel.from(modelUrl).then(model => {
            app.stage.addChild(model);

            // Atur skala agar pas di tengah canvas Framer
            const scaleX = app.screen.width / model.width;
            const scaleY = app.screen.height / model.height;
            const scale = Math.min(scaleX, scaleY) * 0.9; 
            
            model.scale.set(scale);
            model.anchor.set(0.5, 0.5);
            model.position.set(app.screen.width / 2, app.screen.height / 2);

            // Mengaktifkan fitur arah pandang mata mengikuti kursor mouse
            model.interactive = true;
            model.trackedPointers = [{ id: 0, x: app.screen.width / 2, y: app.screen.height / 2 }];

            // Interaksi klik manual (Bisa ditambahkan file gerakannya nanti)
            model.on("pointertap", () => {
                // Jika ingin mencoba pemicu animasi manual nanti, bisa diisi di sini
            });

            window.addEventListener('resize', () => {
                model.position.set(app.screen.width / 2, app.screen.height / 2);
            });
        }).catch(err => {
            console.error("Gagal memuat model Live2D:", err);
        });
    </script>
</body>
</html>
